name: Android build

# Runs on every push to main, or tap "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lets steps check whether signing secrets have been added yet
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web app into www/
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html not found in repo root. Rename your FFT file to index.html."
            exit 1
          fi
          mkdir -p www
          cp index.html www/index.html
          # Capacitor's JS runtime provides registerPlugin(), which the app needs
          # to reach the background GPS plugin. A bundled Capacitor app includes
          # it automatically; this single-file app doesn't, so add it here.
          CJS=node_modules/@capacitor/core/dist/capacitor.js
          if [ ! -f "$CJS" ]; then
            ls -R node_modules/@capacitor/core/dist || true
            echo "::error::capacitor.js not found in @capacitor/core"
            exit 1
          fi
          cp "$CJS" www/capacitor.js
          sed -i '0,/<script/s##<script src="capacitor.js"></script>\n<script#' www/index.html
          grep -n "capacitor.js" www/index.html

      - name: Bundle libraries so the app opens with no signal
        run: |
          # The web version loads Leaflet, pdf.js and Supabase from CDNs. In the
          # forest there's often no signal, so ship local copies inside the app.
          npm install --no-save leaflet@1.9.4 pdfjs-dist@3.11.174 @supabase/supabase-js@2
          for f in node_modules/leaflet/dist/leaflet.js node_modules/pdfjs-dist/build/pdf.min.js \
                   node_modules/pdfjs-dist/build/pdf.worker.min.js node_modules/@supabase/supabase-js/dist/umd/supabase.js; do
            if [ ! -f "$f" ]; then ls -R "$(dirname "$f")" | head -40; echo "::error::$f not found"; exit 1; fi
          done
          mkdir -p www/lib/leaflet www/lib/pdfjs
          cp -r node_modules/leaflet/dist/* www/lib/leaflet/
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdfjs/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.js
          sed -i -e 's#https://unpkg.com/leaflet@1.9.4/dist/#lib/leaflet/#g' \
                 -e 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#lib/pdfjs/#g' \
                 -e 's#https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js#lib/supabase.js#g' www/index.html
          if grep -n "unpkg.com\|cdnjs.cloudflare.com" www/index.html; then
            echo "::error::Some library links still point at a CDN"; exit 1
          fi
          grep -n 'lib/' www/index.html | head

      - name: Create Android project
        run: npx cap add android

      - name: Permissions, version number
        run: |
          M=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.CAMERA" />'
          sed -i "s#</manifest>#    $PERMS\n</manifest>#" "$M"
          # Every build gets a higher versionCode, which Play requires
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "uses-permission" "$M"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: App icon + notification icon
        run: |
          # Icon images live in the repo root (easy to upload from a phone)
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx -y @capacitor/assets generate --android \
            --iconBackgroundColor '#050704' --iconBackgroundColorDark '#050704'
          # Small white tree for the lock-screen / status bar notification
          mkdir -p android/app/src/main/res/drawable
          cp ic_stat_fft.png android/app/src/main/res/drawable/ic_stat_fft.png
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_fft</string>\n    <string name="capacitor_background_geolocation_notification_color">\#d7ff3e</string>\n    <string name="capacitor_background_geolocation_notification_channel_name">FFT tracking</string>\n</resources>#' "$S"
          cat "$S"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK (install straight on your phone to test)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build signed release AAB (for Play Store)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar app/build/outputs/bundle/release/fft-release.aab \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm "$RUNNER_TEMP/upload.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fft-release-aab
          path: android/app/build/outputs/bundle/release/fft-release.aab
