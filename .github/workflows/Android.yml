name: Android build

# Runs on every push to main, or tap "Run workflow" in the Actions tab.
#
# Every build:
#   - Signs the app with your permanent key (secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD),
#     so new versions install over old ones and keep everyone's data.
#   - Publishes a GitHub Release with fft.apk (full app) and www.zip (just the app
#     screens). Installed apps check the latest release and update themselves:
#       * only index.html changed  -> download www.zip in the background (no reinstall)
#       * the app shell changed    -> show "New app version" with a download link
#   Permanent download link: https://github.com/<you>/<repo>/releases/latest/download/fft.apk
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write        # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          # App: invite links (fft://join?code=…). Share: share sheet.
          # Updater: over-the-air updates of the app screens (self-hosted on GitHub Releases).
          npm install @capacitor/app@^8 @capacitor/share@^8 @capgo/capacitor-updater@^8

      - name: Work out the app-shell fingerprint
        run: |
          # Anything here changes the installed app itself (plugins, permissions,
          # icons, build settings) and needs a full reinstall. index.html is NOT
          # included — changes to it are delivered over the air.
          NATIVE_ID=$(cat package.json capacitor.config.json .github/workflows/*.yml icon-only.png icon-foreground.png icon-background.png ic_stat_fft.png 2>/dev/null | sha256sum | cut -c1-12)
          echo "NATIVE_ID=$NATIVE_ID" >> "$GITHUB_ENV"
          echo "Build $BUILD_NO · app shell $NATIVE_ID"

      - name: Updater settings
        run: |
          # Manual mode: the app decides when to update (never mid-track), and
          # nothing is sent to Capgo's servers.
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.plugins = c.plugins || {};
            c.plugins.CapacitorUpdater = Object.assign({}, c.plugins.CapacitorUpdater, {
              autoUpdate: false, statsUrl: "", appReadyTimeout: 15000, autoDeleteFailed: true, autoDeletePrevious: true
            });
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
          '
          cat capacitor.config.json

      - name: Copy web app into www/
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html not found in repo root. Rename your FFT file to index.html."
            exit 1
          fi
          mkdir -p www
          cp index.html www/index.html
          # Capacitor's JS runtime provides registerPlugin(), which the app needs
          # to reach its plugins. A single-file app doesn't include it, so add it.
          CJS=node_modules/@capacitor/core/dist/capacitor.js
          if [ ! -f "$CJS" ]; then
            ls -R node_modules/@capacitor/core/dist || true
            echo "::error::capacitor.js not found in @capacitor/core"
            exit 1
          fi
          cp "$CJS" www/capacitor.js
          # Build info first (the app uses it to check for updates), then Capacitor
          sed -i "0,/<script/s##<script>window.FFT_BUILD={build:$BUILD_NO,native:\"$NATIVE_ID\"};</script>\n<script src=\"capacitor.js\"></script>\n<script#" www/index.html
          grep -n "FFT_BUILD\|capacitor.js" www/index.html | head -3

      - name: Bundle libraries so the app opens with no signal
        run: |
          # The web version loads Leaflet, pdf.js and Supabase from CDNs. In the
          # forest there's often no signal, so ship local copies inside the app.
          npm install --no-save leaflet@1.9.4 pdfjs-dist@3.11.174 @supabase/supabase-js@2
          for f in node_modules/leaflet/dist/leaflet.js node_modules/pdfjs-dist/build/pdf.min.js \
                   node_modules/pdfjs-dist/build/pdf.worker.min.js node_modules/@supabase/supabase-js/dist/umd/supabase.js; do
            if [ ! -f "$f" ]; then ls -R "$(dirname "$f")" | head -40; echo "::error::$f not found"; exit 1; fi
          done
          mkdir -p www/lib/leaflet www/lib/pdfjs
          cp -r node_modules/leaflet/dist/* www/lib/leaflet/
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdfjs/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.js
          sed -i -e 's#https://unpkg.com/leaflet@1.9.4/dist/#lib/leaflet/#g' \
                 -e 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#lib/pdfjs/#g' \
                 -e 's#https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js#lib/supabase.js#g' www/index.html
          if grep -n "unpkg.com\|cdnjs.cloudflare.com" www/index.html; then
            echo "::error::Some library links still point at a CDN"; exit 1
          fi
          grep -n 'lib/' www/index.html | head

      - name: Create Android project
        run: npx cap add android

      - name: Permissions, version number
        run: |
          M=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.CAMERA" />'
          sed -i "s#</manifest>#    $PERMS\n</manifest>#" "$M"
          # Squad invite links: fft://join?code=ABCDE opens the app
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          f = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="fft" android:host="join" />
                      </intent-filter>'''
          i = s.index('</intent-filter>') + len('</intent-filter>')
          s = s[:i] + f + s[i:]
          open(p, 'w').write(s)
          PY
          grep -n 'scheme="fft"' "$M"
          # Every build gets a higher versionCode, which Android needs to accept an update
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NO/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD_NO\"/" android/app/build.gradle
          grep -n "uses-permission" "$M"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: App icon + notification icon
        run: |
          # Icon images live in the repo root (easy to upload from a phone)
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx -y @capacitor/assets generate --android \
            --iconBackgroundColor '#050704' --iconBackgroundColorDark '#050704'
          # Small white tree for the lock-screen / status bar notification
          mkdir -p android/app/src/main/res/drawable
          cp ic_stat_fft.png android/app/src/main/res/drawable/ic_stat_fft.png
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_fft</string>\n    <string name="capacitor_background_geolocation_notification_color">\#d7ff3e</string>\n    <string name="capacitor_background_geolocation_notification_channel_name">FFT tracking</string>\n</resources>#' "$S"
          cat "$S"

      - name: Sync
        run: npx cap sync android

      - name: Use your permanent signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          # Secrets pasted from a phone often pick up a trailing line break or
          # space — strip all whitespace from both before using them.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > android/app/fft-upload.jks
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          echo "::add-mask::$PW"
          echo "FFT_KEY_PW=$PW" >> "$GITHUB_ENV"
          # Check the key opens before the long build, with a plain-English error
          if ! keytool -list -keystore android/app/fft-upload.jks -storepass "$PW" -alias fft >/dev/null 2>&1; then
            echo "::error::The signing key didn't open with KEYSTORE_PASSWORD. Re-paste both secrets from KEYSTORE_BASE64.txt and KEYSTORE_PASSWORD.txt (select all, copy, paste)."
            exit 1
          fi
          echo "Signing key OK"
          cat >> android/app/build.gradle <<'GRADLE'

          // Added by the FFT build: sign with the permanent key so updates install over the top
          android {
              signingConfigs {
                  fftUpload {
                      storeFile file('fft-upload.jks')
                      storePassword System.getenv('FFT_KEY_PW')
                      keyAlias 'fft'
                      keyPassword System.getenv('FFT_KEY_PW')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.fftUpload }
              }
          }
          GRADLE
          tail -18 android/app/build.gradle

      - name: Build signed app (APK to share + AAB for Play Store)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../fft.apk
          cp app/build/outputs/bundle/release/app-release.aab ../fft-release.aab
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" verify --print-certs ../fft.apk | grep -i "SHA-256"
          rm -f app/fft-upload.jks

      - name: No signing key yet — build a test version instead
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: |
          echo "::warning::No KEYSTORE_BASE64 secret, so this test build can't update an existing install. Add the secrets to fix."
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../fft.apk

      - name: Package app screens for over-the-air updates
        run: |
          cd www && zip -qr ../www.zip . && cd ..
          ls -la fft.apk www.zip

      - name: Publish release
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$BUILD_NO"
          META="FFT-META {\"build\":$BUILD_NO,\"native\":\"$NATIVE_ID\"}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" fft.apk www.zip \
            --title "FFT build $BUILD_NO" \
            --notes "$(printf '%s\n\n%s' "$MSG" "$META")" \
            --latest
          # Keep the 15 newest releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +16 | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || true
          done

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: fft-build-${{ github.run_number }}
          path: |
            fft.apk
            fft-release.aab
            www.zip
          if-no-files-found: ignore
