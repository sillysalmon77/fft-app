name: Android build

# Runs on every push to main, or tap "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Lets steps check whether signing secrets have been added yet
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web app into www/
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html not found in repo root. Rename your FFT file to index.html."
            exit 1
          fi
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Permissions, version number
        run: |
          M=android/app/src/main/AndroidManifest.xml
          PERMS='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.CAMERA" />'
          sed -i "s#</manifest>#    $PERMS\n</manifest>#" "$M"
          # Every build gets a higher versionCode, which Play requires
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "uses-permission" "$M"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: App icon + notification icon
        run: |
          # Icon images live in the repo root (easy to upload from a phone)
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx -y @capacitor/assets generate --android \
            --iconBackgroundColor '#050704' --iconBackgroundColorDark '#050704'
          # Small white tree for the lock-screen / status bar notification
          mkdir -p android/app/src/main/res/drawable
          cp ic_stat_fft.png android/app/src/main/res/drawable/ic_stat_fft.png
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_stat_fft</string>\n    <string name="capacitor_background_geolocation_notification_color">\#d7ff3e</string>\n    <string name="capacitor_background_geolocation_notification_channel_name">FFT tracking</string>\n</resources>#' "$S"
          cat "$S"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK (install straight on your phone to test)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build signed release AAB (for Play Store)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar app/build/outputs/bundle/release/fft-release.aab \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm "$RUNNER_TEMP/upload.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fft-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fft-release-aab
          path: android/app/build/outputs/bundle/release/fft-release.aab
